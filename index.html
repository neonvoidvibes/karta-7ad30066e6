.labels .mk span{display:block}
.mk.base span{display:block}
.off{display:none!important}

    line: {highway_path: "#30353d", highway_minor: "#383d46", highway_major_casing: "#2a2e35", highway_major_inner: "#4a505b",
      highway_major_subtle: "#444a54", highway_motorway_subtle: "#3a3f48", railway: "#3a3f48", railway_transit: "#3a3f48", railway_minor: "#3a3f48",
      waterway: "#1c2a39"},
    text: {water_name: "#7f9cc2", highway_name_other: "#b9bfca", highway_name_motorway: "#c9cfd9"}, textPrefix: "place_", place: "#dfe3ea"}};
function tune() {
  const t = TUNE[cur]; if (!t) return;
  const set = (id, k, v) => { if (map.getLayer(id)) map.setPaintProperty(id, k, v); };
  if (t.bg) set("background", "background-color", t.bg);
  // Parks and grass as their own green layer under the water, so every park shows, also where the style leaves it out.
  const before = map.getLayer("water") ? "water" : undefined;
  if (!map.getLayer("fos-grass")) map.addLayer({id: "fos-grass", type: "fill", source: "openmaptiles", "source-layer": "landcover",
    filter: ["==", ["get", "class"], "grass"], paint: {"fill-color": t.park}}, before);
  if (!map.getLayer("fos-park")) map.addLayer({id: "fos-park", type: "fill", source: "openmaptiles", "source-layer": "park",
    paint: {"fill-color": t.park}}, before);
  for (const [id, c] of Object.entries(t.fill || {})) set(id, "fill-color", c);
  for (const [id, c] of Object.entries(t.line || {})) set(id, "line-color", c);
  const halo = id => { set(id, "text-halo-color", "#15181d"); set(id, "text-halo-width", 1.2); };
  for (const [id, c] of Object.entries(t.text || {})) { set(id, "text-color", c); halo(id); }
  if (t.textPrefix) for (const l of map.getStyle().layers) if (l.id.startsWith(t.textPrefix)) { set(l.id, "text-color", t.place); halo(l.id); }
}
map.on("style.load", () => { try { tune(); } catch (e) { console.error("tune", e); } });
const labels = () => document.getElementById("map").classList.toggle("labels", map.getZoom() >= 14);
map.on("zoom", labels); labels();
bar.querySelectorAll("[data-go]").forEach(b => b.onclick = () => map.fitBounds(VIEW[b.dataset.go], {padding: 20}));
bar.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
  b.classList.toggle("on");
  groups[b.dataset.f].forEach(el => el.classList.toggle("off", !b.classList.contains("on")));
});
const setStyle = s => { if (s !== cur) { cur = s; map.setStyle(STYLE(s), {diff: false}); } mark(); };
bar.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { picked = true; setStyle(b.dataset.s); });
darkQ.addEventListener("change", e => { if (!picked) setStyle(e.matches ? "dark" : "liberty"); });
mark();
